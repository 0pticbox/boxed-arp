name: Build BOXED ARP for Logic

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ github.workspace }}
        run: xcodegen generate

      - name: Validate project files
        working-directory: ${{ github.workspace }}
        run: |
          plutil -lint App/Info.plist
          plutil -lint BoxedArpAU/Info.plist
          plutil -lint BoxedArpAU/BoxedArpAU.entitlements
          c++ -std=c++17 Tests/kernel_smoke_test.cpp BoxedArpAU/DSP/BoxedArpKernel.cpp -o /tmp/boxed_arp_kernel_test
          /tmp/boxed_arp_kernel_test

      - name: Build Release
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          xcodebuild \
            -project BoxedArp.xcodeproj \
            -scheme BoxedArp \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package AUv3 app
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          PRODUCT="$GITHUB_WORKSPACE/build/Build/Products/Release/BOXED ARP.app"
          APPEX="$PRODUCT/Contents/PlugIns/BoxedArpAU.appex"
          DIST="$GITHUB_WORKSPACE/dist"

          test -d "$PRODUCT"
          test -d "$APPEX"

          /usr/bin/codesign --force --sign - "$APPEX"
          /usr/bin/codesign --force --sign - "$PRODUCT"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$PRODUCT"

          rm -rf "$DIST"
          mkdir -p "$DIST"
          /usr/bin/ditto "$PRODUCT" "$DIST/BOXED ARP.app"

          if [ -f "$GITHUB_WORKSPACE/Packaging/INSTALL.command" ]; then
            cp "$GITHUB_WORKSPACE/Packaging/INSTALL.command" "$DIST/INSTALL.command"
            chmod +x "$DIST/INSTALL.command"
          fi

          if [ -f "$GITHUB_WORKSPACE/README.md" ]; then
            cp "$GITHUB_WORKSPACE/README.md" "$DIST/README.txt"
          fi

          /usr/bin/ditto -c -k --keepParent "$DIST" "$GITHUB_WORKSPACE/BOXED_ARP_Logic_MIDI_FX.zip"
          ls -lh "$GITHUB_WORKSPACE/BOXED_ARP_Logic_MIDI_FX.zip"

      - name: Upload plug-in download
        uses: actions/upload-artifact@v4
        with:
          name: BOXED-ARP-Logic-MIDI-FX
          path: ${{ github.workspace }}/BOXED_ARP_Logic_MIDI_FX.zip
          if-no-files-found: error
