name: Build BOXED ARP for GarageBand + Logic

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ github.workspace }}
        run: xcodegen generate

      - name: Validate project files
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          plutil -lint App/Info.plist
          plutil -lint BoxedArpMIDIAU/Info.plist
          plutil -lint BoxedArpMIDIAU/BoxedArpAU.entitlements
          plutil -lint BoxedArpInstrumentAU/Info.plist
          plutil -lint BoxedArpInstrumentAU/BoxedArpAU.entitlements
          c++ -std=c++17 Tests/midi_fx_kernel_smoke_test.cpp BoxedArpMIDIAU/DSP/BoxedArpKernel.cpp -o /tmp/boxed_arp_midi_test
          /tmp/boxed_arp_midi_test

      - name: Build Release
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          xcodebuild \
            -project BoxedArp.xcodeproj \
            -scheme BoxedArp \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package GarageBand + Logic app
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          PRODUCT="$GITHUB_WORKSPACE/build/Build/Products/Release/BOXED ARP.app"
          MIDI_APPEX="$PRODUCT/Contents/PlugIns/BoxedArpMIDIAU.appex"
          INST_APPEX="$PRODUCT/Contents/PlugIns/BoxedArpInstrumentAU.appex"
          DIST="$GITHUB_WORKSPACE/dist"

          test -d "$PRODUCT"
          test -d "$MIDI_APPEX"
          test -d "$INST_APPEX"

          echo "Built extensions:"
          ls -la "$PRODUCT/Contents/PlugIns"

          /usr/bin/codesign --force --sign - "$MIDI_APPEX"
          /usr/bin/codesign --force --sign - "$INST_APPEX"
          /usr/bin/codesign --force --sign - "$PRODUCT"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$PRODUCT"

          rm -rf "$DIST"
          mkdir -p "$DIST"
          /usr/bin/ditto "$PRODUCT" "$DIST/BOXED ARP.app"
          cp "$GITHUB_WORKSPACE/Packaging/INSTALL.command" "$DIST/INSTALL.command"
          chmod +x "$DIST/INSTALL.command"

          if [ -f "$GITHUB_WORKSPACE/README.md" ]; then
            cp "$GITHUB_WORKSPACE/README.md" "$DIST/README.txt"
          fi

          /usr/bin/ditto -c -k --keepParent "$DIST" "$GITHUB_WORKSPACE/BOXED_ARP_GarageBand_Logic.zip"
          ls -lh "$GITHUB_WORKSPACE/BOXED_ARP_GarageBand_Logic.zip"

      - name: Upload combined plug-in download
        uses: actions/upload-artifact@v4
        with:
          name: BOXED-ARP-GarageBand-Logic
          path: ${{ github.workspace }}/BOXED_ARP_GarageBand_Logic.zip
          if-no-files-found: error
