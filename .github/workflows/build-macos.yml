name: Build BOXED ARP for Logic

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate project files
        run: |
          plutil -lint App/Info.plist
          plutil -lint BoxedArpAU/Info.plist
          plutil -lint BoxedArpAU/BoxedArpAU.entitlements
          c++ -std=c++17 Tests/kernel_smoke_test.cpp BoxedArpAU/DSP/BoxedArpKernel.cpp -o /tmp/boxed_arp_kernel_test
          /tmp/boxed_arp_kernel_test

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project BoxedArp.xcodeproj \
            -scheme BoxedArp \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build.log

      - name: Package AUv3 app
        run: |
          set -e
          PRODUCT="$PWD/build/Build/Products/Release/BOXED ARP.app"
          APPEX="$PRODUCT/Contents/PlugIns/BoxedArpAU.appex"
          test -d "$PRODUCT"
          test -d "$APPEX"

          /usr/bin/codesign --force --sign - "$APPEX"
          /usr/bin/codesign --force --sign - "$PRODUCT"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$PRODUCT"

          mkdir -p dist
          /usr/bin/ditto "$PRODUCT" "dist/BOXED ARP.app"
          cp Packaging/INSTALL.command dist/INSTALL.command
          cp README.md dist/README.txt
          chmod +x dist/INSTALL.command
          /usr/bin/ditto -c -k --keepParent dist "BOXED_ARP_Logic_MIDI_FX.zip"

      - name: Upload plug-in download
        uses: actions/upload-artifact@v4
        with:
          name: BOXED-ARP-Logic-MIDI-FX
          path: BOXED_ARP_Logic_MIDI_FX.zip
          if-no-files-found: error
