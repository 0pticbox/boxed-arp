name: BoxedArp
options:
  bundleIdPrefix: com.opticbox
  deploymentTarget:
    macOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"

targets:
  BoxedArp:
    type: application
    platform: macOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opticbox.boxedarp
        PRODUCT_NAME: "BOXED ARP"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: BoxedArpMIDIAU
        embed: true
      - target: BoxedArpInstrumentAU
        embed: true

  BoxedArpMIDIAU:
    type: app-extension
    platform: macOS
    sources:
      - path: BoxedArpMIDIAU/AudioUnit
      - path: BoxedArpMIDIAU/DSP
      - path: BoxedArpMIDIAU/UI
      - path: BoxedArpMIDIAU/Config/BoxedArp-Bridging-Header.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opticbox.boxedarp.midi
        PRODUCT_NAME: BoxedArpMIDIAU
        PRODUCT_MODULE_NAME: BoxedArpMIDIAU
        INFOPLIST_FILE: BoxedArpMIDIAU/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: BoxedArpMIDIAU/Config/BoxedArp-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/BoxedArpMIDIAU/DSP"
        CODE_SIGN_ENTITLEMENTS: BoxedArpMIDIAU/BoxedArpAU.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudioKit.framework
      - sdk: Cocoa.framework

  BoxedArpInstrumentAU:
    type: app-extension
    platform: macOS
    sources:
      - path: BoxedArpInstrumentAU/Audio
      - path: BoxedArpInstrumentAU/DSP
      - path: BoxedArpInstrumentAU/UI
      - path: BoxedArpInstrumentAU/BoxedArpAU-Bridging-Header.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opticbox.boxedarp.instrument
        PRODUCT_NAME: BoxedArpInstrumentAU
        PRODUCT_MODULE_NAME: BoxedArpInstrumentAU
        INFOPLIST_FILE: BoxedArpInstrumentAU/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: BoxedArpInstrumentAU/BoxedArpAU-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: BoxedArpInstrumentAU/BoxedArpAU.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudioKit.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMIDI.framework
      - sdk: SwiftUI.framework
      - sdk: AppKit.framework
      - sdk: UniformTypeIdentifiers.framework

schemes:
  BoxedArp:
    build:
      targets:
        BoxedArp: all
        BoxedArpMIDIAU: all
        BoxedArpInstrumentAU: all
    run:
      config: Debug
    archive:
      config: Release
